[tox]
env_list =
    lint
    perf
    py312
    py311
minversion = 4.14.2


[testenv]
description = run the tests with pytest
package = wheel
wheel_build_env = .pkg
deps =
    pytest>=6
    requests
allowlist_externals = cd, chmod, tests/mouse_allsteps.sh, tests/tug_allsteps.sh, tests/uw_allsteps.sh, sh 
commands =
    python3 {tox_root}/tests/download_examples.py # could be improved by using pyzenodo
    sh tests/mouse_allsteps.sh
    sh tests/tug_allsteps.sh
    sh tests/uw_allsteps.sh

[testenv:lint]
description = run linting and formatting checks with Ruff
deps =
    ruff>=0.4
commands =
    python -m ruff check HDF5Translator/translator.py HDF5Translator/utils/data_utils.py HDF5Translator/utils/hdf5_utils.py tests/test_data_utils_unit.py tests/test_hdf5_utils_unit.py tests/test_performance.py tests/test_translator_integration.py
    python -m ruff format --check HDF5Translator/translator.py HDF5Translator/utils/data_utils.py HDF5Translator/utils/hdf5_utils.py tests/test_data_utils_unit.py tests/test_hdf5_utils_unit.py tests/test_performance.py tests/test_translator_integration.py

[testenv:perf]
description = run performance benchmarks (non-blocking)
deps =
    pytest>=6
commands =
    python -m pytest -m perf -q
ignore_outcome = true
